name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed with the debug key for testing on phones; Play Store uploads
      # will need a real upload key (see docs/THIET_KE.md).
      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      # Build logs need a GitHub login to read; this puts the error lines on
      # the run's summary page where anyone (and Claude) can see them.
      - name: Show why the build failed
        if: failure()
        shell: bash
        run: |
          grep -nE "error|Error|FAILED|What went wrong|Exception|lint" -A3 build.log | tail -60 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 12 errors.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=APK build::$msg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nho-nhe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
